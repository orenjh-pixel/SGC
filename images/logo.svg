<?xml version="1.0" encoding="UTF-8"?>
<!-- Star Group Construction — full horizontal lockup (emblem + wordmark).
     For social/share/letterhead use. The site header builds the wordmark in
     live text next to logo-mark.svg, so it always matches the site font. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" role="img" aria-label="Star Group Construction">
  <g transform="translate(10,15) scale(0.9)">
    <circle cx="50" cy="50" r="47" stroke="#C8A24B" stroke-width="1.5" fill="none"/>
    <circle cx="50" cy="50" r="40.5" stroke="#C8A24B" stroke-width="0.6" opacity="0.4" fill="none"/>
    <path d="M69.8,30.2 L57.5,50 L69.8,69.8 L50,57.5 L30.2,69.8 L42.5,50 L30.2,30.2 L50,42.5 Z" fill="#97772C"/>
    <path d="M50,12 L58,42 L88,50 L58,58 L50,88 L42,58 L12,50 L42,42 Z" fill="#C8A24B"/>
    <circle cx="50" cy="50" r="4.4" fill="#0E0F12"/>
    <circle cx="50" cy="50" r="2.1" fill="#E3C982"/>
  </g>
  <text x="135" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="500" letter-spacing="7" fill="#C8A24B">STAR GROUP</text>
  <line x1="136" y1="74" x2="476" y2="74" stroke="#C8A24B" stroke-width="1" opacity="0.5"/>
  <text x="137" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" font-weight="400" letter-spacing="15.5" fill="#E3C982">CONSTRUCTION</text>
</svg>
